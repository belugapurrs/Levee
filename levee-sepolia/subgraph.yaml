specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Levee
    network: sepolia
    source:
      address: "0x736EBbB005de7b594DD082D026fa4e088e16d58E"
      abi: Levee
      startBlock: 11684853
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Committed
        - Deposited
        - Released
        - Spent
      abis:
        - name: Levee
          file: ./abis/Levee.json
      eventHandlers:
        - event: Committed(indexed address,indexed uint256,uint256,uint256,string)
          handler: handleCommitted
        - event: Deposited(indexed address,uint256)
          handler: handleDeposited
        - event: Released(indexed address,indexed uint256,uint256)
          handler: handleReleased
        - event: Spent(indexed address,indexed address,uint256)
          handler: handleSpent
      file: ./src/levee.ts
